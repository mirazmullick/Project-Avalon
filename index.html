/* ---------- Config: GitHub-as-storage ---------- */
const CFG_KEY = "avalon-gh-config";
const DATA_PATH = "data.json";

function getConfig() {
  try { return JSON.parse(localStorage.getItem(CFG_KEY) || "null"); } catch (e) { return null; }
}
function setConfig(cfg) { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }

function ghHeaders(token) {
  return { "Authorization": "token " + token, "Accept": "application/vnd.github+json" };
}

async function ghGetFile(cfg) {
  const url = "https://api.github.com/repos/" + cfg.owner + "/" + cfg.repo + "/contents/" + DATA_PATH;
  const res = await fetch(url, { headers: ghHeaders(cfg.token) });
  if (res.status === 404) return { content: null, sha: null };
  if (!res.ok) throw new Error("GitHub read failed (" + res.status + ")");
  const json = await res.json();
  const content = JSON.parse(decodeURIComponent(escape(atob(json.content.replace(/
/g, "")))));
  return { content, sha: json.sha };
}

async function ghPutFile(cfg, dataObj, sha) {
  const url = "https://api.github.com/repos/" + cfg.owner + "/" + cfg.repo + "/contents/" + DATA_PATH;
  const body = {
    message: "Update Avalon budget data",
    content: btoa(unescape(encodeURIComponent(JSON.stringify(dataObj, null, 2)))),
  };
  if (sha) body.sha = sha;
  const res = await fetch(url, { method: "PUT", headers: Object.assign({ "Content-Type": "application/json" }, ghHeaders(cfg.token)), body: JSON.stringify(body) });
  if (!res.ok) {
    const t = await res.text();
    throw new Error("GitHub write failed (" + res.status + "): " + t);
  }
  const json = await res.json();
  return json.content.sha;
}

/* ---------- Helpers ---------- */
function money(n) { const v = Number(n) || 0; return "BDT " + v.toLocaleString("en-IN", { maximumFractionDigits: 0 }); }
function pctStr(n) { return (n * 100).toFixed(1) + "%"; }
function sumEntries(entries) { return entries.reduce((s, e) => s + (Number(e.amount) || 0), 0); }
function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

const ICON = {
  chevronRight: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>',
  chevronDown: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>',
  trash: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>',
  plus: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
  pencil: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>',
};

/* ---------- App state ---------- */
let state = { data: null, loading: true, saveError: null, sha: null, openRow: null, drafts: {}, editingBudget: false, cfg: getConfig(), needsSetup: false };

function flatCategories(data) {
  const out = [];
  data.phases.forEach((p) => p.categories.forEach((c) => out.push(Object.assign({}, c, { phaseId: p.id }))));
  return out;
}
function phaseSpent(data, phaseId) { return flatCategories(data).filter((c) => c.phaseId === phaseId).reduce((s, c) => s + sumEntries(c.entries), 0); }
function phasePlanned(data, phaseId) { return flatCategories(data).filter((c) => c.phaseId === phaseId).reduce((s, c) => s + (Number(c.planned) || 0), 0); }

async function persist(next) {
  state.data = next;
  render();
  const cfg = state.cfg;
  if (!cfg) return;
  try {
    const sha = await ghPutFile(cfg, next, state.sha);
    state.sha = sha;
    state.saveError = null;
  } catch (e) {
    state.saveError = "Couldn't save to GitHub: " + e.message;
  }
  render();
}

async function loadFromGitHub() {
  const cfg = state.cfg;
  if (!cfg) { state.needsSetup = true; state.loading = false; render(); return; }
  try {
    const res = await ghGetFile(cfg);
    if (res.content) {
      state.data = res.content;
      state.sha = res.sha;
    } else {
      state.data = defaultData();
      state.sha = await ghPutFile(cfg, state.data, null);
    }
  } catch (e) {
    state.saveError = "Couldn't reach GitHub: " + e.message;
    state.data = defaultData();
  }
  state.loading = false;
  render();
}

/* ---------- Event delegation ---------- */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.getAttribute("data-action");
  const phaseId = el.getAttribute("data-phase");
  const catId = el.getAttribute("data-cat");
  const entryId = el.getAttribute("data-entry");

  if (action === "toggle-row") {
    const key = phaseId + ":" + catId;
    state.openRow = state.openRow === key ? null : key;
    render();
  } else if (action === "add-category") {
    const next = JSON.parse(JSON.stringify(state.data));
    const p = next.phases.find((p) => p.id === phaseId);
    p.categories.push({ id: uid(), name: "New line item", planned: 0, entries: [] });
    persist(next);
  } else if (action === "delete-entry") {
    const next = JSON.parse(JSON.stringify(state.data));
    const p = next.phases.find((p) => p.id === phaseId);
    const c = p.categories.find((c) => c.id === catId);
    c.entries = c.entries.filter((en) => en.id !== entryId);
    persist(next);
  } else if (action === "add-entry") {
    const key = phaseId + ":" + catId;
    const draft = state.drafts[key] || {};
    const amount = Number(draft.amount) || 0;
    if (amount <= 0) return;
    const next = JSON.parse(JSON.stringify(state.data));
    const p = next.phases.find((p) => p.id === phaseId);
    const c = p.categories.find((c) => c.id === catId);
    c.entries.push({ id: uid(), date: draft.date || new Date().toISOString().slice(0, 10), amount, note: draft.note || "" });
    state.drafts[key] = { date: "", amount: "", note: "" };
    persist(next);
  } else if (action === "edit-budget") {
    state.editingBudget = true;
    render();
    const input = document.querySelector('[data-role="budget-input"]');
    if (input) input.focus();
  } else if (action === "save-setup") {
    const owner = document.querySelector('[data-role="cfg-owner"]').value.trim();
    const repo = document.querySelector('[data-role="cfg-repo"]').value.trim() || "Project-Avalon";
    const token = document.querySelector('[data-role="cfg-token"]').value.trim();
    if (!owner || !token) return;
    state.cfg = { owner, repo, token };
    setConfig(state.cfg);
    state.needsSetup = false;
    state.loading = true;
    render();
    loadFromGitHub();
  }
});

document.addEventListener("input", (e) => {
  const el = e.target;
  const field = el.getAttribute("data-field");
  if (!field) return;
  const phaseId = el.getAttribute("data-phase");
  const catId = el.getAttribute("data-cat");
  const key = phaseId + ":" + catId;

  if (field === "category-name") {
    state.data.phases.find((p) => p.id === phaseId).categories.find((c) => c.id === catId).name = el.value;
  } else if (field === "category-planned") {
    state.data.phases.find((p) => p.id === phaseId).categories.find((c) => c.id === catId).planned = el.value;
  } else if (field === "draft-date") {
    state.drafts[key] = Object.assign({}, state.drafts[key], { date: el.value });
    return;
  } else if (field === "draft-amount") {
    state.drafts[key] = Object.assign({}, state.drafts[key], { amount: el.value });
    return;
  } else if (field === "draft-note") {
    state.drafts[key] = Object.assign({}, state.drafts[key], { note: el.value });
    return;
  }
});

document.addEventListener("blur", (e) => {
  const el = e.target;
  if (el.getAttribute && el.getAttribute("data-field") === "category-name") persist(state.data);
  if (el.getAttribute && el.getAttribute("data-field") === "category-planned") persist(state.data);
  if (el.getAttribute && el.getAttribute("data-role") === "budget-input") {
    state.data.totalBudget = Number(el.value) || 0;
    state.editingBudget = false;
    persist(state.data);
  }
}, true);

document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.getAttribute && e.target.getAttribute("data-role") === "budget-input") e.target.blur();
});

/* ---------- Render pieces ---------- */
function renderSetup() {
  return '<div class="max-w-md mx-auto px-6 py-20">' +
    '<h1 class="text-xl font-semibold mb-2">Connect this page to your GitHub repo</h1>' +
    '<p class="text-sm text-[#4A7FA7] mb-6 leading-relaxed">Data is stored as data.json inside your repo. Paste a fine-grained personal access token scoped only to this one repository, with Contents read and write permission. It is saved only in this browser\'s local storage, never sent anywhere except directly to GitHub\'s API.</p>' +
    '<label class="block text-xs text-[#4A7FA7] mb-1">GitHub username</label>' +
    '<input data-role="cfg-owner" class="w-full border border-[#D7E4F0] rounded-lg px-3 py-2 text-sm mb-3" placeholder="your-username" />' +
    '<label class="block text-xs text-[#4A7FA7] mb-1">Repository name</label>' +
    '<input data-role="cfg-repo" class="w-full border border-[#D7E4F0] rounded-lg px-3 py-2 text-sm mb-3" placeholder="Project-Avalon" value="Project-Avalon" />' +
    '<label class="block text-xs text-[#4A7FA7] mb-1">Personal access token</label>' +
    '<input data-role="cfg-token" type="password" class="w-full border border-[#D7E4F0] rounded-lg px-3 py-2 text-sm mb-5" placeholder="github_pat_..." />' +
    '<button data-action="save-setup" class="bg-[#1A3D63] text-white text-sm rounded-lg px-4 py-2">Connect</button>' +
    '</div>';
}

function renderDonut(data) {
  const total = data.phases.reduce((s, p) => s + phasePlanned(data, p.id), 0) || 1;
  let acc = 0;
  const stops = data.phases.map((p) => {
    const v = phasePlanned(data, p.id);
    const start = (acc / total) * 100;
    acc += v;
    const end = (acc / total) * 100;
    return p.color + " " + start.toFixed(2) + "% " + end.toFixed(2) + "%";
  }).join(", ");
  return '<div class="relative w-full flex items-center justify-center" style="height:260px">' +
    '<div class="rounded-full" style="width:220px;height:220px;background:conic-gradient(' + stops + ')"></div>' +
    '<div class="absolute rounded-full bg-[#F6FAFD] flex items-center justify-center flex-col" style="width:130px;height:130px">' +
    '<div class="text-xs text-[#4A7FA7]">Total budget</div>' +
    '<div class="text-sm font-semibold">' + money(data.totalBudget) + '</div>' +
    '</div></div>';
}

function renderRolloutChart(rollout) {
  const w = 700, h = 220, padL = 30, padB = 24, padT = 10;
  const innerW = w - padL - 10, innerH = h - padB - padT;
  const bandW = innerW / rollout.length;
  const barW = bandW * 0.55;
  const maxVal = Math.max(1, ...rollout.map((m) => Math.max(m.foundation + m.b2b + m.b2c + m.b2e, m.actualTotal)));
  let bars = "";
  let linePoints = [];
  rollout.forEach((m, i) => {
    const x = padL + i * bandW + (bandW - barW) / 2;
    let y = h - padB;
    const segs = [["foundation", "#0A1931"], ["b2b", "#1A3D63"], ["b2c", "#4A7FA7"], ["b2e", "#B3CFE5"]];
    segs.forEach(([key, color]) => {
      const val = m[key];
      const segH = (val / maxVal) * innerH;
      y -= segH;
      if (segH > 0.3) bars += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + segH.toFixed(1) + '" fill="' + color + '" />';
    });
    const actualY = h - padB - (m.actualTotal / maxVal) * innerH;
    linePoints.push((x + barW / 2).toFixed(1) + "," + actualY.toFixed(1));
    bars += '<text x="' + (x + barW / 2).toFixed(1) + '" y="' + (h - 6) + '" font-size="10" fill="#4A7FA7" text-anchor="middle">' + m.label.split(" ")[0] + "</text>";
  });
  const line = '<polyline points="' + linePoints.join(" ") + '" fill="none" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="4 3" />' +
    linePoints.map((p) => { const [px, py] = p.split(","); return '<circle cx="' + px + '" cy="' + py + '" r="2.5" fill="#C0392B" />'; }).join("");
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" class="w-full" style="height:220px">' + bars + line + '</svg>';
}

function renderApp() {
  if (state.needsSetup) return renderSetup();
  if (state.loading || !state.data) {
    return '<div class="w-full min-h-[420px] flex items-center justify-center py-24 text-sm">Loading dashboard…</div>';
  }
  const data = state.data;
  const flat = flatCategories(data);
  const overallPlanned = flat.reduce((s, c) => s + (Number(c.planned) || 0), 0);
  const overallSpent = flat.reduce((s, c) => s + sumEntries(c.entries), 0);
  const totalBudget = Number(data.totalBudget) || 0;
  const remaining = totalBudget - overallSpent;
  const committedRatio = totalBudget > 0 ? overallPlanned / totalBudget : 0;

  let cum = 0;
  const rollout = ROLLOUT_PLAN.map((m, i) => {
    const target = m.foundation + m.b2b + m.b2c + m.b2e;
    cum += target;
    const lower = Math.round(cum * 0.9);
    const rawUpper = Math.round(cum * 1.1);
    const upper = i === ROLLOUT_PLAN.length - 1 ? Math.min(rawUpper, totalBudget || rawUpper) : rawUpper;
    const actual = flat.reduce((s, c) => s + c.entries.filter((e) => { const d = new Date(e.date); return !isNaN(d) && d.getFullYear() === m.year && d.getMonth() === m.month; }).reduce((s2, e) => s2 + (Number(e.amount) || 0), 0), 0);
    return Object.assign({}, m, { target, actualTotal: actual, cumTarget: cum, cumLower: lower, cumUpper: upper });
  });

  let html = "";
  html += '<div class="bg-[#0A1931] px-6 sm:px-12 py-14"><div class="max-w-4xl">';
  html += '<div class="text-xs mb-4 text-[#B3CFE5]">Go-to-market and budget projection</div>';
  html += '<h1 class="text-3xl sm:text-4xl font-semibold text-white mb-4 leading-tight">Project Avalon</h1>';
  html += '<p class="text-sm sm:text-base leading-relaxed max-w-2xl mb-2" style="color:#C9D9E8">A seven-month rollout across B2B, B2C, and B2E, built to turn a 35-year agency\'s trust into digital market share. B2B carries the first six to seven months of revenue and proof. B2C builds anticipation in parallel without paid acquisition. B2E follows once B2B has real results to show.</p>';
  html += '<p class="text-xs mb-8" style="color:#8FA9C2">Nov 2026 to May 2027 &middot; B2B, then B2C, then B2E</p>';
  if (state.saveError) html += '<div class="text-xs mb-4" style="color:#F0A99C">' + esc(state.saveError) + '</div>';
  html += '<div class="flex flex-wrap gap-8">';
  html += '<div><div class="text-xs mb-1" style="color:#8FA9C2">Total budget</div>' +
    (state.editingBudget
      ? '<input data-role="budget-input" type="number" value="' + totalBudget + '" class="text-white text-lg font-semibold outline-none bg-transparent border-b" style="border-color:#8FA9C2" />'
      : '<button data-action="edit-budget" class="text-white text-lg font-semibold flex items-center gap-1.5">' + money(totalBudget) + ' <span style="color:#8FA9C2">' + ICON.pencil + '</span></button>') +
    '</div>';
  html += '<div><div class="text-xs mb-1" style="color:#8FA9C2">Committed</div><div class="text-white text-lg font-semibold">' + money(overallPlanned) + '</div><div class="text-xs mt-0.5" style="color:#8FA9C2">' + pctStr(committedRatio) + ' of budget</div></div>';
  html += '<div><div class="text-xs mb-1" style="color:#8FA9C2">Spent so far</div><div class="text-white text-lg font-semibold">' + money(overallSpent) + '</div>' + (totalBudget > 0 ? '<div class="text-xs mt-0.5" style="color:#8FA9C2">' + pctStr(overallSpent / totalBudget) + ' of budget</div>' : '') + '</div>';
  html += '<div><div class="text-xs mb-1" style="color:#8FA9C2">Remaining</div><div class="text-lg font-semibold" style="color:' + (remaining < 0 ? '#F0A99C' : '#fff') + '">' + money(remaining) + '</div></div>';
  html += '</div></div></div>';

  html += '<div class="max-w-4xl mx-auto px-6 sm:px-12 py-12 space-y-16">';

  html += '<section><div class="text-xs mb-2 text-[#4A7FA7]">Why this order</div><h2 class="text-xl font-semibold mb-3">B2B first, B2C in waiting, B2E once proven</h2><p class="text-sm leading-relaxed max-w-2xl text-[#4A7FA7]">B2B produces fewer, larger wins faster, using a warm agent network that already trusts the parent brand. B2C needs a mature product and real word of mouth before it deserves paid spend, so months one through seven build anticipation rather than chase strangers. B2E waits until month four, when B2B case studies exist to make the pitch credible.</p></section>';

  html += '<section><div class="text-xs mb-2 text-[#4A7FA7]">Where the budget goes</div><h2 class="text-xl font-semibold mb-6">' + money(totalBudget) + ', split four ways</h2><div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center">';
  html += renderDonut(data);
  html += '<div class="space-y-4">';
  data.phases.forEach((p) => {
    html += '<div class="flex gap-3"><div class="shrink-0" style="background:' + p.color + ';width:10px;height:10px;border-radius:2px;margin-top:5px"></div><div class="flex-1">' +
      '<div class="flex items-baseline gap-2 text-sm font-medium flex-wrap"><span>' + p.label + '</span><span class="text-[#4A7FA7]">' + p.pct + '%, ' + money(phasePlanned(data, p.id)) + ' planned</span></div>' +
      '<p class="text-xs leading-relaxed mt-0.5 text-[#4A7FA7]">' + p.desc + '</p>' +
      '<p class="text-xs mt-1 text-[#1A3D63]">' + money(phaseSpent(data, p.id)) + ' spent so far</p></div></div>';
  });
  html += '</div></div></section>';

  html += '<section><div class="text-xs mb-2 text-[#4A7FA7]">Track actual spend</div><h2 class="text-xl font-semibold mb-6">Log spend against each line item</h2><div class="grid grid-cols-1 md:grid-cols-2 gap-4">';
  data.phases.forEach((p) => {
    html += '<div class="rounded-2xl p-5 bg-white border border-[#D7E4F0]"><div class="text-sm font-medium mb-3">' + p.label + '</div>';
    p.categories.forEach((c) => {
      const spent = sumEntries(c.entries);
      const rowKey = p.id + ":" + c.id;
      const draft = state.drafts[rowKey] || { date: "", amount: "", note: "" };
      const isOpen = state.openRow === rowKey;
      html += '<div class="py-2.5 border-t border-[#EAF3FA]"><div class="flex items-center gap-2 flex-wrap">' +
        '<input data-field="category-name" data-phase="' + p.id + '" data-cat="' + c.id + '" value="' + esc(c.name) + '" class="text-xs font-medium outline-none bg-transparent flex-1 min-w-0" />' +
        '<div class="flex items-center gap-1 text-xs text-[#4A7FA7]">planned <input data-field="category-planned" data-phase="' + p.id + '" data-cat="' + c.id + '" type="number" value="' + (c.planned || "") + '" style="width:70px" class="outline-none bg-transparent border-b text-right" /></div>' +
        '<span class="text-xs whitespace-nowrap text-[#4A7FA7]">spent ' + money(spent) + '</span>' +
        '<button data-action="toggle-row" data-phase="' + p.id + '" data-cat="' + c.id + '" class="text-[#1A3D63]">' + (isOpen ? ICON.chevronDown : ICON.chevronRight) + '</button>' +
        '</div>';
      if (isOpen) {
        html += '<div class="mt-2">';
        if (c.entries.length > 0) {
          html += '<div class="mb-2 space-y-1">';
          c.entries.slice().sort((a, b) => new Date(b.date) - new Date(a.date)).forEach((e) => {
            html += '<div class="flex items-center gap-2 text-xs text-[#4A7FA7]"><span style="width:78px">' + esc(e.date) + '</span><span style="width:80px" class="font-medium">' + money(e.amount) + '</span><span class="flex-1 truncate">' + esc(e.note) + '</span><button data-action="delete-entry" data-phase="' + p.id + '" data-cat="' + c.id + '" data-entry="' + e.id + '" class="text-[#4A7FA7]">' + ICON.trash + '</button></div>';
          });
          html += '</div>';
        }
        html += '<div class="flex flex-wrap gap-2">' +
          '<input data-field="draft-date" data-phase="' + p.id + '" data-cat="' + c.id + '" type="date" value="' + esc(draft.date) + '" class="text-xs border rounded px-1.5 py-1 outline-none bg-transparent border-[#D7E4F0]" />' +
          '<input data-field="draft-amount" data-phase="' + p.id + '" data-cat="' + c.id + '" type="number" placeholder="amount" value="' + esc(draft.amount) + '" style="width:80px" class="text-xs border rounded px-1.5 py-1 outline-none bg-transparent border-[#D7E4F0]" />' +
          '<input data-field="draft-note" data-phase="' + p.id + '" data-cat="' + c.id + '" type="text" placeholder="note" value="' + esc(draft.note) + '" class="text-xs border rounded px-1.5 py-1 outline-none bg-transparent border-[#D7E4F0] flex-1 min-w-[6rem]" />' +
          '<button data-action="add-entry" data-phase="' + p.id + '" data-cat="' + c.id + '" class="text-xs rounded px-2 py-1 text-white bg-[#1A3D63]">Log</button></div></div>';
      }
      html += '</div>';
    });
    html += '<button data-action="add-category" data-phase="' + p.id + '" class="text-xs mt-2 flex items-center gap-1 text-[#1A3D63]">' + ICON.plus + ' add line item</button></div>';
  });
  html += '</div></section>';

  html += '<section><div class="text-xs mb-2 text-[#4A7FA7]">The process</div><h2 class="text-xl font-semibold mb-2">Brand visibility, awareness, and word-of-mouth conversion</h2><p class="text-sm leading-relaxed max-w-2xl mb-6 text-[#4A7FA7]">Each segment moves through the same three stages, but the tactic underneath is different every time, because a corporate travel manager, a retail traveler, and an HR head do not discover trust the same way.</p><div class="space-y-8">';
  FUNNEL.forEach((f) => {
    html += '<div class="pt-5 border-t border-[#D7E4F0]"><div class="text-sm font-semibold mb-3 text-[#1A3D63]">' + f.segment + '</div><div class="grid grid-cols-1 sm:grid-cols-3 gap-5">' +
      '<div><div class="text-xs font-medium mb-1">Brand visibility</div><p class="text-xs leading-relaxed text-[#4A7FA7]">' + f.visibility + '</p></div>' +
      '<div><div class="text-xs font-medium mb-1">Awareness</div><p class="text-xs leading-relaxed text-[#4A7FA7]">' + f.awareness + '</p></div>' +
      '<div><div class="text-xs font-medium mb-1">Word-of-mouth conversion</div><p class="text-xs leading-relaxed text-[#4A7FA7]">' + f.wom + '</p></div>' +
      '</div></div>';
  });
  html += '</div></section>';

  html += '<section><div class="text-xs mb-2 text-[#4A7FA7]">Rollout</div><h2 class="text-xl font-semibold mb-1">Seven months, Nov 2026 to May 2027</h2><p class="text-sm mb-6 text-[#4A7FA7]">Target spend by phase, month by month, with actual logged spend overlaid as a dashed line.</p>';
  html += '<div class="mb-8">' + renderRolloutChart(rollout) + '</div>';
  html += '<div class="relative pl-6"><div class="absolute left-1.5 top-1 bottom-1" style="width:1px;background:#D7E4F0"></div><div class="space-y-6">';
  rollout.forEach((m, i) => {
    let cumActual = 0;
    for (let j = 0; j <= i; j++) cumActual += rollout[j].actualTotal;
    const started = new Date() >= new Date(m.year, m.month, 1);
    const inBand = cumActual >= m.cumLower && cumActual <= m.cumUpper;
    html += '<div class="relative"><div class="absolute top-1" style="background:#1A3D63;width:9px;height:9px;border-radius:999px;left:-25px"></div>' +
      '<div class="flex items-baseline gap-2 mb-1 flex-wrap"><span class="text-sm font-medium">' + m.label + '</span><span class="text-xs text-[#4A7FA7]">target ' + money(m.target) + '</span>' +
      (started ? '<span class="text-xs font-medium" style="color:' + (inBand ? '#2E9E5B' : '#C0392B') + '">' + (cumActual > 0 ? money(cumActual) + ' logged, ' + (inBand ? 'in band' : (cumActual < m.cumLower ? 'behind' : 'over')) : 'no spend logged yet') + '</span>' : '') +
      '</div><p class="text-xs leading-relaxed max-w-xl text-[#4A7FA7]">' + m.highlight + '</p></div>';
  });
  html += '</div></div></section>';

  html += '<section><div class="text-xs mb-2 text-[#4A7FA7]">What we are measuring</div><h2 class="text-xl font-semibold mb-6">Success metrics by segment</h2><div class="grid grid-cols-1 sm:grid-cols-2 gap-6">';
  KPIS.forEach((k) => {
    html += '<div class="rounded-2xl p-5 bg-white border border-[#D7E4F0]"><div class="text-sm font-semibold mb-3 text-[#1A3D63]">' + k.segment + '</div><ul class="space-y-1.5">';
    k.metrics.forEach((m) => {
      html += '<li class="text-xs flex gap-2 text-[#4A7FA7]"><span class="shrink-0" style="background:#B3CFE5;width:5px;height:5px;border-radius:999px;margin-top:6px"></span><span>' + m + '</span></li>';
    });
    html += '</ul></div>';
  });
  html += '</div></section>';

  html += '<div class="pt-6 text-xs leading-relaxed text-[#4A7FA7] border-t border-[#D7E4F0]">This is a projection, tracked live above against a 10 percent tolerance band each month and a hard cap at the total budget in the final month. Allocations may shift between phases as early results come in, always within the approved total. Stored in this repository\'s data.json, so it is the same on any device you sign in from.</div>';

  html += '</div>';
  return html;
}

function render() { document.getElementById("app").innerHTML = renderApp(); }

render();
loadFromGitHub();
</script>
</body>
</html>
